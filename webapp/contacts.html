<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mt — contacts</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- The people page. Every row, tag and sheet comes from app.css, so this reads as the
     same app as /, /review and /archive. All behaviour lives in contacts.js — there is
     deliberately no inline script here. -->
<div class="wrap">
  <header>
    <h1>mt <span>· contacts</span></h1>
    <a class="nav" href="/">&larr; meetings</a>
    <a class="nav" href="/tracking">Tracking &rarr;</a>
    <a class="nav" href="/weekly">Weekly &rarr;</a>
    <a class="nav" href="/files">Files &rarr;</a>
    <a class="nav" href="/help">Help &rarr;</a>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="on" data-tab="all">Everyone</button>
    <button data-tab="queue">Needs confirmation</button>
    <button data-tab="dupes">Duplicate names</button>
    <button data-tab="voices">Voices with no contact</button>
    <button data-tab="triage">Needs a real name</button>
    <button data-tab="archived">Archived</button>
  </div>

  <div class="filters" id="filters">
    <input type="search" id="cq" autocomplete="off" spellcheck="false"
           placeholder="Search name, email, role, company, aliases…">
    <select id="ccust"><option value="">Every account</option></select>
    <select id="cstatus">
      <option value="">Any status</option>
      <option value="verified">Verified</option>
      <option value="needs_confirmation">Needs confirmation</option>
    </select>
    <button id="cnew">+ Add someone</button>
  </div>

  <div id="count" class="count"></div>
  <div id="list" class="rows"><div class="empty">loading…</div></div>
</div>

<script src="/static/md.js"></script>
<script src="/static/pager.js"></script>
<script src="/static/contacts.js"></script>
<script src="/static/nav.js"></script>
</body>
</html>
